server {
    listen 80;
    server_name api.lateralzr.com;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/lateralzr-access.log;
    error_log /var/log/nginx/lateralzr-error.log;

    # Handle Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Traefik terminates TLS; tell PHP the original request was HTTPS
        # so Filament/Livewire generate https:// asset and form URLs.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Livewire serves JS via a Laravel route, not a static file.
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset optimization — fall back to PHP so hashed Filament/Livewire
    # routes are not 404'd by this regex location.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }
}
