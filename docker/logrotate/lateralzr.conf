# Template for host or container logrotate.
# deploy-prod / bin/rotate-prod-logs rewrite this with absolute paths
# under <data-dir>/logs (sibling of LATERALZR_STORAGE).
#
# Do not install into /etc/logrotate.d with these placeholders.
# Production does not use the VPS crontab; the scheduler runs
# bin/rotate-prod-logs daily.

/var/log/lateralzr-host/nginx/*.log
/var/log/lateralzr-host/queue/*.log
/var/log/lateralzr-host/scheduler/*.log {
    daily
    rotate 14
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
