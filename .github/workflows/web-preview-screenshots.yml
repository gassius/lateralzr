# Cheap per-push Expo web + Playwright 390×844 stills for design review.
# NOT native acceptance — label artifacts as web preview only.
name: Web preview screenshots

on:
  pull_request:
  workflow_dispatch:
    inputs:
      screens:
        description: Comma-separated screen ids (empty = map from changed files)
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  web-preview-screenshots:
    name: Expo web · Playwright 390×844
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve capture screens
        id: screens
        env:
          INPUT_SCREENS: ${{ github.event.inputs.screens || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SCREENS}" ]]; then
            echo "screens=${INPUT_SCREENS}" >> "$GITHUB_OUTPUT"
            echo "Using workflow_dispatch screens: ${INPUT_SCREENS}"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            mapfile -t FILES < <(git diff --name-only "${BASE}...${HEAD}" || true)
          else
            mapfile -t FILES < <(git diff --name-only origin/main...HEAD || true)
          fi
          SCREENS="$(printf '%s\n' "${FILES[@]:-}" | node scripts/web-preview-capture/map-changed-screens.mjs)"
          echo "screens=${SCREENS}" >> "$GITHUB_OUTPUT"
          echo "Mapped screens: ${SCREENS}"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Expo web export (E2E fixtures)
        working-directory: apps/client
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:4173
          EXPO_PUBLIC_E2E: '1'
        run: pnpm run e2e:build

      - name: Serve export + capture 390×844 stills
        env:
          WEB_PREVIEW_SCREENS: ${{ steps.screens.outputs.screens }}
          WEB_PREVIEW_OUT_DIR: artifacts/web-preview-captures
          WEB_PREVIEW_BASE_URL: http://127.0.0.1:4173
          WEB_PREVIEW_SETTLE_MS: '2000'
          WEB_PREVIEW_HEAD_SHA: ${{ env.WEB_PREVIEW_HEAD_SHA }}
        run: |
          set -euo pipefail
          pnpm --filter client exec serve -s dist -l tcp://127.0.0.1:4173 > /tmp/web-preview-serve.log 2>&1 &
          echo $! > /tmp/web-preview-serve.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4173/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:4173/" >/dev/null
          node scripts/web-preview-capture/capture-screens.mjs
          kill "$(cat /tmp/web-preview-serve.pid)" || true

      - name: Upload web preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-captures-${{ env.WEB_PREVIEW_HEAD_SHA }}
          path: artifacts/web-preview-captures/
          if-no-files-found: warn
          retention-days: 14
