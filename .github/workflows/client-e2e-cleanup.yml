# Remove pr-<n>/ from orphan e2e-screenshots when a PR closes.
# Write token only; never checks out or runs the PR tree.
# Script is fetched from the PR base SHA only (trusted), never from head.

name: Client E2E cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-pr-screenshots:
    name: Remove pr folder from e2e-screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch cleanup script via API (base only; no repo checkout)
        id: fetch_script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/client-e2e-cleanup-pr.mjs?ref=${BASE_SHA}" \
            -o /tmp/client-e2e-cleanup-pr.mjs; then
            echo "Cleanup script not on base ${BASE_SHA}; skip until scripts land on the base branch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Delete pr-<n>/ on orphan branch
        if: steps.fetch_script.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node /tmp/client-e2e-cleanup-pr.mjs
