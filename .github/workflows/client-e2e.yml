# Deterministic Playwright screenshots for the Expo web client.
# Runs on PRs / main pushes that touch apps/client (or this workflow).

name: Client E2E

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - '.github/workflows/client-e2e.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/client/**'
      - '.github/workflows/client-e2e.yml'
  workflow_dispatch:
    inputs:
      strict_baselines:
        description: 'Fail on baseline diffs (Critiquito-approved mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  client-e2e:
    name: Client E2E screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build Expo web export (no GTM)
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:4173
        run: pnpm build

      - name: Run Playwright E2E
        env:
          CI: 'true'
          E2E_PORT: '4173'
          E2E_STRICT_BASELINES: ${{ github.event.inputs.strict_baselines == 'true' && '1' || '0' }}
        run: pnpm e2e

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-screenshots
          path: |
            apps/client/e2e/screenshots
            apps/client/e2e/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Post or update PR screenshot comment
        if: github.event_name == 'pull_request' && always()
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/client/e2e/scripts/post-pr-comment.mjs
