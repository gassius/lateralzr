# Deterministic Playwright screenshots for the Expo web client.
# Security: the test job is contents:read + persist-credentials:false and never
# receives a write token. Privileged jobs only download artifacts (no pnpm/expo).

name: Client E2E

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - '.github/workflows/client-e2e.yml'
      - '.github/scripts/client-e2e-*.mjs'
  push:
    branches: [main, master]
    paths:
      - 'apps/client/**'
      - '.github/workflows/client-e2e.yml'
      - '.github/scripts/client-e2e-*.mjs'
  workflow_dispatch:
    inputs:
      strict_baselines:
        description: 'Fail on baseline diffs (Critiquito-approved mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  client-e2e:
    name: Client E2E screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert no GitHub write credentials in git config
        working-directory: .
        run: |
          set -euo pipefail
          if git config --get http.https://github.com/.extraheader; then
            echo "::error::git http.https://github.com/.extraheader must be empty in the test job"
            exit 1
          fi
          echo "OK: no http.https://github.com/.extraheader"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build Expo web export (no GTM)
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:4173
        run: pnpm build

      - name: Run Playwright E2E
        env:
          CI: 'true'
          E2E_PORT: '4173'
          E2E_STRICT_BASELINES: ${{ github.event.inputs.strict_baselines == 'true' && '1' || '0' }}
        run: pnpm e2e

      - name: Smoke stability (--repeat-each=2)
        env:
          CI: 'true'
          E2E_PORT: '4173'
        run: pnpm exec playwright test -c e2e/playwright.config.ts e2e/specs/smoke.spec.ts --repeat-each=2

      - name: Stage flat artifact tree
        if: always()
        working-directory: apps/client
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-artifact/screenshots /tmp/e2e-artifact/playwright-report
          if [ -d e2e/screenshots ]; then cp -a e2e/screenshots/. /tmp/e2e-artifact/screenshots/; fi
          if [ -d e2e/playwright-report ]; then cp -a e2e/playwright-report/. /tmp/e2e-artifact/playwright-report/; fi
          find /tmp/e2e-artifact/screenshots -name '*.png' | wc -l

      - name: Upload screenshots, diffs, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-screenshots
          path: /tmp/e2e-artifact
          if-no-files-found: warn
          retention-days: 14

  # Write token: artifact only. No actions/checkout of the PR tree; no pnpm/expo.
  client-e2e-publish:
    name: Client E2E PR comment
    needs: client-e2e
    if: github.event_name == 'pull_request' && always() && needs.client-e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: client-e2e-screenshots
          path: artifact

      - name: Fetch publish script via API (no repo checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/client-e2e-publish.mjs?ref=${GITHUB_SHA}" \
            -o /tmp/client-e2e-publish.mjs

      - name: Orphan-branch push + sticky PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/artifact/screenshots
        run: |
          set -euo pipefail
          echo "SCREENSHOTS_DIR=${SCREENSHOTS_DIR}"
          find "${SCREENSHOTS_DIR}" -name '*.png' | head -20 || true
          node /tmp/client-e2e-publish.mjs

  # On main only: publish captures as committed baselines (write job; no install/build).
  client-e2e-baselines:
    name: Client E2E baselines
    needs: client-e2e
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: client-e2e-screenshots
          path: artifact

      - name: Publish baselines from artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/artifact/screenshots
          BASELINES_DIR: apps/client/e2e/baselines
        run: node .github/scripts/client-e2e-publish-baselines.mjs
