# Deterministic Playwright screenshots for the Expo web client.
# Security: the test job is contents:read + persist-credentials:false and never
# receives a write token. Privileged jobs only download artifacts (no pnpm/expo).
#
# Every workflow run reports required check "Client E2E screenshots" (static job
# name, never skipped): capture on opened/synchronize/reopened/push/dispatch;
# on labeled/unlabeled, pass-through mirrors the newest capture run on the head
# SHA (success/failure; poll if still running; fail on timeout if none).
# Pass-through excludes its own GITHUB_RUN_ID / check-run id when selecting.
# Full matrix: labeled run-full-screenshots → reusable workflow posts
# "Client E2E full screenshots". Other labels must not cancel capture/full runs.

name: Client E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
    paths:
      - 'apps/client/**'
      - '.github/workflows/client-e2e.yml'
      - '.github/workflows/client-e2e-full.yml'
      - '.github/scripts/client-e2e-*.mjs'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.npmrc'
  workflow_dispatch:
    inputs:
      strict_baselines:
        description: 'Fail on baseline diffs (UI/UX and Art Supervisor (gasnet-art-director)-approved mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  # No concurrency — label events must not cancel an in-progress capture/full run.
  gate:
    name: Client E2E gate
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      run_full: ${{ steps.decide.outputs.run_full }}
      screenshots_concurrency_group: ${{ steps.decide.outputs.screenshots_concurrency_group }}
      screenshots_cancel: ${{ steps.decide.outputs.screenshots_cancel }}
    steps:
      - name: Decide capture vs pass-through
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && { [ "${EVENT_ACTION}" = "labeled" ] || [ "${EVENT_ACTION}" = "unlabeled" ]; }; then
            if [ "${EVENT_ACTION}" = "labeled" ] && [ "${LABEL_NAME}" = "run-full-screenshots" ]; then
              {
                echo "mode=passthrough"
                echo "run_full=true"
                echo "screenshots_concurrency_group=client-e2e-passthrough-${RUN_ID}"
                echo "screenshots_cancel=false"
              } >> "$GITHUB_OUTPUT"
              echo "Labeled run-full-screenshots → pass-through required check + full matrix job"
              exit 0
            fi
            {
              echo "mode=passthrough"
              echo "run_full=false"
              echo "screenshots_concurrency_group=client-e2e-passthrough-${RUN_ID}"
              echo "screenshots_cancel=false"
            } >> "$GITHUB_OUTPUT"
            echo "Label event '${EVENT_ACTION}'/'${LABEL_NAME}' → pass-through required check only"
            exit 0
          fi

          {
            echo "mode=capture"
            echo "run_full=false"
            echo "screenshots_cancel=true"
            if [ -n "${PR_NUMBER}" ] && [ "${PR_NUMBER}" != "" ]; then
              echo "screenshots_concurrency_group=client-e2e-pr-${PR_NUMBER}"
            else
              echo "screenshots_concurrency_group=client-e2e-${REF_NAME}"
            fi
          } >> "$GITHUB_OUTPUT"

  # Any new push drops the one-shot full-run label so the next full run is explicit.
  clear-run-full-screenshots-label:
    name: Clear run-full-screenshots label
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove run-full-screenshots if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/label-del.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/run-full-screenshots" || true)"
          if [ "${code}" = "204" ] || [ "${code}" = "404" ]; then
            echo "Label clear HTTP ${code}"
            exit 0
          fi
          echo "::error::Unexpected HTTP ${code} removing run-full-screenshots"
          cat /tmp/label-del.json || true
          exit 1

  # Required check — static name, never skipped (pass-through or capture).
  client-e2e:
    name: Client E2E screenshots
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.gate.outputs.screenshots_concurrency_group }}
      cancel-in-progress: ${{ needs.gate.outputs.screenshots_cancel == 'true' }}
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      should_run: ${{ steps.passthrough.outputs.should_run || steps.plan.outputs.should_run || 'false' }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Pass-through required check
        id: passthrough
        if: needs.gate.outputs.mode == 'passthrough'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          # Hard cap so pass-through cannot wait on itself / a missing capture forever.
          PASSTHROUGH_WAIT_SECONDS: '1200'
        run: |
          set -euo pipefail
          {
            echo "<!-- client-e2e-mode:passthrough -->"
            echo "### Client E2E screenshots (pass-through)"
            echo "Mirroring newest capture run on \`${HEAD_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "should_run=false"
          } >> "$GITHUB_OUTPUT"

          if [ -z "${HEAD_SHA}" ]; then
            echo "::error::HEAD_SHA empty; cannot mirror capture check"
            exit 1
          fi

          # Fetch exclude-self helper (pass-through job has no checkout).
          script_dir="$(mktemp -d)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/client-e2e-passthrough.mjs?ref=${HEAD_SHA}" \
            --jq '.content' | tr -d '\n' | base64 -d > "${script_dir}/client-e2e-passthrough.mjs"

          # Job id == check-run id for GitHub Actions; exclude even if details_url is empty.
          CURRENT_CHECK_RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "Client E2E screenshots") | .id' \
              | head -n1
          )"
          export CURRENT_CHECK_RUN_ID
          echo "Excluding self run_id=${CURRENT_RUN_ID} check_run_id=${CURRENT_CHECK_RUN_ID:-unknown}"

          wait_seconds="${PASSTHROUGH_WAIT_SECONDS}"
          deadline=$((SECONDS + wait_seconds))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            mapfile -t candidates < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Client%20E2E%20screenshots&per_page=100" \
                --jq '[.check_runs[]]' \
                | jq -s 'add // []' \
                | CURRENT_RUN_ID="${CURRENT_RUN_ID}" CURRENT_CHECK_RUN_ID="${CURRENT_CHECK_RUN_ID:-}" \
                  node "${script_dir}/client-e2e-passthrough.mjs" exclude-self-ids
            )

            capture_id=""
            capture_status=""
            capture_conclusion=""
            for id in "${candidates[@]+"${candidates[@]}"}"; do
              [ -n "${id}" ] || continue
              # Belt-and-suspenders: never mirror our own check-run.
              if [ -n "${CURRENT_CHECK_RUN_ID:-}" ] && [ "${id}" = "${CURRENT_CHECK_RUN_ID}" ]; then
                continue
              fi
              job_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}" 2>/dev/null || true)"
              if [ -z "${job_json}" ]; then
                continue
              fi
              kind="$(jq -r '
                (.steps // []) as $s
                | if any($s[]; .name == "Pass-through required check") then "passthrough"
                  elif any($s[]; .name == "Mark capture run") then "capture"
                  elif any($s[]; .name == "Plan E2E tier") then "capture"
                  else "unknown"
                  end
              ' <<<"${job_json}")"
              summary="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}" --jq '.output.summary // ""' 2>/dev/null || true)"
              case "${summary}" in
                *client-e2e-mode:passthrough*) kind="passthrough" ;;
                *client-e2e-mode:capture*) kind="capture" ;;
              esac
              if [ "${kind}" = "passthrough" ]; then
                continue
              fi
              status="$(jq -r '.status' <<<"${job_json}")"
              conclusion="$(jq -r '.conclusion // empty' <<<"${job_json}")"
              if [ "${kind}" = "capture" ]; then
                capture_id="${id}"
                capture_status="${status}"
                capture_conclusion="${conclusion}"
                break
              fi
              # In-progress job with no identifying steps yet: wait rather than guess
              # (self already excluded by run id + check-run id).
              if [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ] || [ "${status}" = "waiting" ]; then
                capture_id="${id}"
                capture_status="${status}"
                capture_conclusion=""
                break
              fi
            done

            if [ -z "${capture_id}" ]; then
              echo "No capture run visible yet on ${HEAD_SHA}; waiting..."
              sleep 20
              continue
            fi

            echo "Newest capture check-run id=${capture_id} status=${capture_status} conclusion=${capture_conclusion:-none}"

            if [ "${capture_status}" = "completed" ]; then
              if [ "${capture_conclusion}" = "success" ]; then
                echo "Mirroring capture success."
                exit 0
              fi
              echo "::error::Mirroring capture conclusion=${capture_conclusion}"
              exit 1
            fi

            echo "Capture still ${capture_status}; waiting..."
            sleep 20
          done

          echo "::error::Timed out after ${wait_seconds}s waiting for Client E2E screenshots capture on ${HEAD_SHA} (none completed successfully)"
          exit 1

      - name: Mark capture run
        if: needs.gate.outputs.mode == 'capture'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "<!-- client-e2e-mode:capture -->"
            echo "### Client E2E screenshots (capture)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: needs.gate.outputs.mode == 'capture'
        with:
          persist-credentials: false

      - name: Detect client-related paths
        id: filter
        if: needs.gate.outputs.mode == 'capture' && github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            client:
              - 'apps/client/**'
              - '.github/workflows/client-e2e.yml'
              - '.github/workflows/client-e2e-full.yml'
              - '.github/scripts/client-e2e-*.mjs'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.npmrc'
          list-files: json

      - name: Plan E2E tier
        id: plan
        if: needs.gate.outputs.mode == 'capture'
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_FULL: 'false'
          CLIENT_CHANGED: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.client }}
          CLIENT_FILES: ${{ github.event_name == 'pull_request' && steps.filter.outputs.client_files || '[]' }}
        run: |
          set -euo pipefail
          node --test .github/scripts/client-e2e-plan.test.mjs .github/scripts/client-e2e-passthrough.test.mjs
          node .github/scripts/client-e2e-plan.mjs

      - name: Skip capture (no client-related paths)
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run != 'true'
        working-directory: .
        run: |
          echo "Client E2E screenshots: nothing to capture for this PR."
          echo "Required check reports success without Playwright / publish / sticky comment."

      - name: Assert no GitHub write credentials in git config
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          if git config --get http.https://github.com/.extraheader; then
            echo "::error::git http.https://github.com/.extraheader must be empty in the test job"
            exit 1
          fi
          echo "OK: no http.https://github.com/.extraheader"

      - name: Install pnpm
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Cache Expo web export
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        uses: actions/cache@v4
        id: expo-web-cache
        with:
          path: apps/client/dist
          key: expo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/client/package.json', 'apps/client/app.json', 'apps/client/tsconfig.json', 'apps/client/metro.config.js', 'apps/client/*.config.*') }}-${{ hashFiles('apps/client/app/**', 'apps/client/components/**', 'apps/client/lib/**', 'apps/client/hooks/**', 'apps/client/constants/**', 'apps/client/assets/**', 'apps/client/theme/**') }}

      - name: Confirm cached Expo web export
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true' && steps.expo-web-cache.outputs.cache-hit == 'true'
        run: test -f dist/index.html

      - name: Build Expo web export (no GTM)
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true' && steps.expo-web-cache.outputs.cache-hit != 'true'
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:4173
        run: pnpm build

      - name: Sync orphan e2e-screenshots:baselines/ (read-only)
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer UI/UX and Art Supervisor (gasnet-art-director)-approved baselines on the orphan branch. If that folder
          # is missing/empty, keep in-repo demo seeds under e2e/baselines/.
          TMP=$(mktemp -d)
          CLONE="${TMP}/orphan"
          if git clone --depth=1 --branch e2e-screenshots --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${CLONE}"; then
            if [ -d "${CLONE}/baselines" ] && find "${CLONE}/baselines" -maxdepth 1 -name '*.png' | grep -q .; then
              mkdir -p e2e/baselines
              # Replace compare set with orphan baselines (demo seeds only used as fallback).
              find e2e/baselines -maxdepth 1 -name '*.png' -delete
              cp -a "${CLONE}/baselines/." e2e/baselines/
              echo "Using orphan baselines:"
              find e2e/baselines -maxdepth 1 -name '*.png' | wc -l
            else
              echo "Orphan baselines/ empty; keeping in-repo demo seeds."
            fi
          else
            echo "Orphan branch e2e-screenshots missing; keeping in-repo demo seeds."
          fi
          rm -rf "${TMP}"

      - name: Run Playwright E2E
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        env:
          CI: 'true'
          E2E_PORT: '4173'
          E2E_STRICT_BASELINES: ${{ github.event.inputs.strict_baselines == 'true' && '1' || '0' }}
          E2E_MODE: ${{ steps.plan.outputs.mode }}
          E2E_PROJECT: ${{ steps.plan.outputs.project }}
          E2E_GREP: ${{ steps.plan.outputs.grep }}
          E2E_GREP_INVERT: ${{ steps.plan.outputs.grep_invert }}
          E2E_SPECS: ${{ steps.plan.outputs.specs }}
        run: |
          set -euo pipefail
          if [ "${E2E_MODE}" = "full" ]; then
            pnpm e2e
            exit 0
          fi
          args=(-c e2e/playwright.config.ts)
          read -r -a specs <<< "${E2E_SPECS}"
          args+=("${specs[@]}")
          if [ -n "${E2E_PROJECT}" ]; then
            args+=(--project "${E2E_PROJECT}")
          fi
          if [ -n "${E2E_GREP}" ]; then
            args+=(--grep "${E2E_GREP}")
          fi
          if [ -n "${E2E_GREP_INVERT}" ]; then
            args+=(--grep-invert "${E2E_GREP_INVERT}")
          fi
          echo "Subset Playwright args: ${args[*]}"
          pnpm exec playwright test "${args[@]}"

      - name: Smoke stability (--repeat-each=2) + pixel-identical captures
        if: needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true' && steps.plan.outputs.run_stability == 'true'
        env:
          CI: 'true'
          E2E_PORT: '4173'
        run: |
          set -euo pipefail
          pnpm exec playwright test -c e2e/playwright.config.ts e2e/specs/smoke.spec.ts --repeat-each=2
          # Two independent capture passes; assert ≥1 PNG is byte/pixel-identical across runs.
          for pass in 1 2; do
            rm -rf "e2e/screenshots/repeat-${pass}"
            E2E_SHOT_SUBDIR="repeat-${pass}" \
              pnpm exec playwright test -c e2e/playwright.config.ts \
                e2e/specs/card-front.spec.ts e2e/specs/laterality-bar.spec.ts \
                --project=390x844 -g "short label|grade 3"
          done
          node e2e/scripts/assert-repeat-identical.mjs \
            e2e/screenshots/repeat-1 \
            e2e/screenshots/repeat-2

      - name: Stage flat artifact tree
        if: always() && needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        working-directory: apps/client
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Capture tip baked into the artifact — publish compares this file to the
          # live PR head from the API (do not trust workflow-run SHA at publish time).
          ARTIFACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-artifact/screenshots /tmp/e2e-artifact/playwright-report
          if [ -d e2e/screenshots ]; then cp -a e2e/screenshots/. /tmp/e2e-artifact/screenshots/; fi
          if [ -d e2e/playwright-report ]; then cp -a e2e/playwright-report/. /tmp/e2e-artifact/playwright-report/; fi
          if [ -z "${ARTIFACT_HEAD_SHA}" ]; then
            echo "::error::ARTIFACT_HEAD_SHA empty; cannot stamp artifact"
            exit 1
          fi
          printf '%s' "${ARTIFACT_HEAD_SHA}" > /tmp/e2e-artifact/artifact-head-sha.txt
          echo "Stamped artifact-head-sha.txt=${ARTIFACT_HEAD_SHA} (event=${EVENT_NAME})"
          find /tmp/e2e-artifact/screenshots -name '*.png' | wc -l

      - name: Upload screenshots, diffs, and report
        if: always() && needs.gate.outputs.mode == 'capture' && steps.plan.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-screenshots
          path: /tmp/e2e-artifact
          if-no-files-found: warn
          retention-days: 14

  # Caller name is NOT the check name — when skipped on other labels, prior
  # "Client E2E full screenshots" results on the commit are preserved.
  start-full-screenshots:
    name: Start Client E2E full screenshots
    needs: gate
    if: needs.gate.outputs.run_full == 'true'
    uses: ./.github/workflows/client-e2e-full.yml
    with:
      strict_baselines: ${{ github.event.inputs.strict_baselines || 'false' }}

  # Write token: artifact only. No actions/checkout of the PR tree; no pnpm/expo.
  # Scripts are fetched from the PR base SHA only (trusted), never from head / merge SHA.
  client-e2e-publish:
    name: Client E2E PR comment
    needs: [gate, client-e2e, start-full-screenshots]
    if: >-
      github.event_name == 'pull_request'
      && always()
      && (
        (needs.gate.outputs.mode == 'capture'
          && needs.client-e2e.result != 'cancelled'
          && needs.client-e2e.outputs.should_run == 'true')
        || (needs.gate.outputs.run_full == 'true'
          && needs.start-full-screenshots.result == 'success'
          && needs.start-full-screenshots.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: client-e2e-screenshots
          path: artifact

      # Read tip from the artifact file; compare to live PR head from the API.
      # Do not use github.sha / event head from this workflow run as the artifact identity.
      - name: Guard — publish only if artifact SHA is current PR tip
        id: head_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SHA_FILE="${GITHUB_WORKSPACE}/artifact/artifact-head-sha.txt"
          if [ ! -f "${SHA_FILE}" ]; then
            echo "::error::artifact-head-sha.txt missing from artifact; refuse publish"
            exit 1
          fi
          ARTIFACT_HEAD_SHA="$(tr -d '[:space:]' < "${SHA_FILE}")"
          CURRENT="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            | jq -r .head.sha)"
          echo "artifact_head=${ARTIFACT_HEAD_SHA}"
          echo "current_head=${CURRENT}"
          if [ -z "${ARTIFACT_HEAD_SHA}" ]; then
            echo "::error::artifact-head-sha.txt empty; refuse publish"
            exit 1
          fi
          if [ -z "${CURRENT}" ] || [ "${CURRENT}" = "null" ]; then
            echo "::error::Could not resolve current PR head SHA from API"
            exit 1
          fi
          echo "artifact_head_sha=${ARTIFACT_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${ARTIFACT_HEAD_SHA}" != "${CURRENT}" ]; then
            echo "Stale run: artifact SHA is not current PR head; skip orphan publish (no-op)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch publish script via API (base only; no repo checkout)
        id: fetch_script
        if: steps.head_guard.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/client-e2e-publish.mjs?ref=${BASE_SHA}" \
            -o /tmp/client-e2e-publish.mjs; then
            echo "Publish script not on base ${BASE_SHA}; skip write publish until scripts land on the base branch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Orphan-branch push + sticky PR comment
        if: steps.head_guard.outputs.stale != 'true' && steps.fetch_script.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/artifact/screenshots
          # Tip stamped into the artifact (not workflow-run github.sha).
          ARTIFACT_HEAD_SHA: ${{ steps.head_guard.outputs.artifact_head_sha }}
          GITHUB_SHA: ${{ steps.head_guard.outputs.artifact_head_sha }}
        run: |
          set -euo pipefail
          echo "SCREENSHOTS_DIR=${SCREENSHOTS_DIR}"
          find "${SCREENSHOTS_DIR}" -name '*.png' | head -20 || true
          node /tmp/client-e2e-publish.mjs

  # On main only: publish captures to orphan e2e-screenshots:baselines/ (write job; no install/build).
  # Push events use github.sha of the trusted main commit (not a pull_request write path).
  client-e2e-baselines:
    name: Client E2E baselines
    needs: [gate, client-e2e]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && needs.gate.outputs.mode == 'capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: client-e2e-screenshots
          path: artifact

      - name: Fetch baselines publish script via API (no repo checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/client-e2e-publish-baselines.mjs?ref=${SCRIPT_REF}" \
            -o /tmp/client-e2e-publish-baselines.mjs

      - name: Publish baselines to orphan e2e-screenshots:baselines/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/artifact/screenshots
        run: |
          set -euo pipefail
          echo "SCREENSHOTS_DIR=${SCREENSHOTS_DIR}"
          find "${SCREENSHOTS_DIR}" -name '*.png' | head -20 || true
          node /tmp/client-e2e-publish-baselines.mjs
