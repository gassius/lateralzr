# Mirror EXPO_PUBLIC_GTM_* from GitHub Environment `prod` into Vercel Production
# so Git-integration builds also receive the same container IDs.
# Source of truth remains GitHub Environments — never commit real IDs.

name: Sync Client GTM Env

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-client-gtm-env.yml'

jobs:
  sync:
    name: Sync GTM vars to Vercel
    runs-on: ubuntu-latest
    environment: prod
    env:
      EXPO_PUBLIC_GTM_ANDROID: ${{ vars.EXPO_PUBLIC_GTM_ANDROID }}
      EXPO_PUBLIC_GTM_IOS: ${{ vars.EXPO_PUBLIC_GTM_IOS }}
      EXPO_PUBLIC_GTM_WEB: ${{ vars.EXPO_PUBLIC_GTM_WEB }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Upsert GTM env vars on Vercel Production
        working-directory: apps/client
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN secret is required on Environment prod"
            exit 1
          fi

          upsert() {
            local key="$1"
            local value="${2:-}"
            if [[ -z "$value" ]]; then
              echo "Skip ${key} (empty in GitHub Environment prod)"
              return 0
            fi
            echo "Upsert ${key} → Vercel production (value redacted)"
            vercel env rm "$key" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$key" production --token="$VERCEL_TOKEN"
          }

          upsert EXPO_PUBLIC_GTM_ANDROID "${EXPO_PUBLIC_GTM_ANDROID}"
          upsert EXPO_PUBLIC_GTM_IOS "${EXPO_PUBLIC_GTM_IOS}"
          upsert EXPO_PUBLIC_GTM_WEB "${EXPO_PUBLIC_GTM_WEB}"
