# Deploy Expo web client with GTM container IDs from GitHub Environment `prod`.
# Source of truth for EXPO_PUBLIC_GTM_* is GitHub → Environments → prod (variables).
# Never commit real container IDs.

name: Deploy Client

on:
  push:
    branches:
      - main
    paths:
      - 'apps/client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

concurrency:
  group: deploy-client-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Expo web
    runs-on: ubuntu-latest
    environment: prod
    env:
      # Injected from GitHub Environment `prod` (Settings → Environments → prod).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GTM_ANDROID: ${{ vars.EXPO_PUBLIC_GTM_ANDROID }}
      EXPO_PUBLIC_GTM_IOS: ${{ vars.EXPO_PUBLIC_GTM_IOS }}
      EXPO_PUBLIC_GTM_WEB: ${{ vars.EXPO_PUBLIC_GTM_WEB }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Default API URL when unset
        run: |
          if [[ -z "${EXPO_PUBLIC_API_URL}" ]]; then
            echo "EXPO_PUBLIC_API_URL=https://api.lateralzr.com" >> "$GITHUB_ENV"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/client

      # vercel.json buildCommand runs turbo/expo export; job env bakes EXPO_PUBLIC_* into the bundle.
      - name: Build for Vercel Production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/client

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/client
